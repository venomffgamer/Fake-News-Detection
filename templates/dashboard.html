<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake News Detection - Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
  <div class="d-flex flex-column flex-lg-row">
    <!-- Sidebar -->
    <div class="sidebar bg-light-skyblue text-white p-3">
      <h3 class="text-center mb-4">Fake News Detection</h3>
      <ul class="nav flex-column">
        <li class="mb-4">
            <a  class="text-white text-decoration-none active" href="#">
                <i class="fa-solid fa-home me-2"></i> Dashboard
            </a>
        </li>
        <li class="mb-4">
            <a class="text-white text-decoration-none" href="/news" > Search For News</a>
        </li>
        <li class="mb-4">
            <a  class="text-white text-decoration-none" href="/visualization">
                <i class="fa-solid fa-newspaper me-2"></i> Visualization
            </a>
        </li>
        <li class="mb-4">
            <a class="text-white text-decoration-none" href="#">
                <i class="fa-solid fa-newspaper me-2"></i> News 3
            </a>
        </li>
    </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content flex-grow-1 p-3">
      <!-- Top Bar -->
      <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded">
        <div class="search-bar w-50">
          <input type="text" class="form-control" placeholder="Search here...">
        </div>
        <div>
          <button class="btn btn-primary dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa-regular fa-user me-2"></i> 
            <span id="user-name">{{ user['name'] }}</span> <!-- Display user's name -->
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="{{ url_for('logout') }}">Logout</a></li>
          </ul>
        </div>
      </div>

      <!-- Dashboard Widgets -->
      <div class="row mt-4 g-3">
        <div class="col-md-6 col-lg-3">
          <div class="card text-white bg-primary">
            <div class="card-header">Active Categories</div>
            <div class="card-body">
              <h5 class="card-title">7</h5>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-white bg-success">
            <div class="card-header">Active Ads</div>
            <div class="card-body">
              <h5 class="card-title">4</h5>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-white bg-warning">
            <div class="card-header">Orders</div>
            <div class="card-body">
              <h5 class="card-title">809</h5>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-white bg-danger">
            <div class="card-header">Payments</div>
            <div class="card-body">
              <h5 class="card-title">1200</h5>
            </div>
          </div>
        </div>
      </div>

      <!-- Additional Button to Display User's Name -->
      <div class="mt-4">
        <button class="btn btn-info btn-lg w-100">Welcome, {{ user['name'] }}</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
