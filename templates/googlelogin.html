<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fake News Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .header {
            background-color: #8fd3ff;
            color: #fff;
            padding: 15px 20px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
            font-size: 16px;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        .login-box {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        .login-box h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }
        .btn {
            background-color: #8fd3ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #6cb8e8;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="header">
        <h1>Google Login</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="#">About</a>
            <a href="#">Recent News</a>
            <a href="#">How It Works</a>
        </nav>
    </div>
    <div class="container">
        <div class="login-box">
            <h2>Sign In or Sign Up</h2>
            <!-- Google Sign-In Button -->
             
            <div id="g_id_onload"
                data-client_id="567891971421-vt9bv8ceifgll96r9me58vto7v6gkdr7.apps.googleusercontent.com" 
                data-login_uri="http://127.0.0.1:5000/login"
                data-auto_prompt="false"> <!-- Updated Client ID -->
                
            </div>
            <!-- Render the Google Sign-In button below -->
            <div id="g_id_signin" class="g_id_signin"   data-type="standard"
            data-size="large"
            data-theme="outline"
            data-text="sign_in_with"
            data-shape="rectangular"
            data-logo_alignment="left">
                
            </div> <!-- Button will be rendered here -->
        </div>
    </div>


        <script>
            function handleCredentialResponse(response) {
                const id_token = response.credential;
                fetch('/oauth2callback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ credential: id_token })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        window.location.href = "/"; // Redirect to home page
                    } else {
                        alert("Login failed!");
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        
            window.onload = function () {
                google.accounts.id.initialize({
                    client_id: "567891971421-vt9bv8ceifgll96r9me58vto7v6gkdr7.apps.googleusercontent.com",
                    callback: handleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("g_id_signin"),
                    { theme: "outline", size: "large" }
                );
            };
        </script>
        
    
</body>
</html>
